<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frida Control</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--fg:#e6e8ec;--dim:#8b919c;--ok:#3ddc84;--bad:#ff6b6b;--warn:#ffc857;--line:#262a33}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
h1{font-size:17px;margin:0 0 4px}
.sub{color:var(--dim);font-size:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.k{color:var(--dim);flex:0 0 auto}
.v{text-align:right;word-break:break-all;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.on{background:var(--ok)}.off{background:var(--dim)}.err{background:var(--bad)}
button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:#1e222b;color:var(--fg);font-size:14px}
button:active{background:#2a2f3a}
button.primary{background:#1f6feb;border-color:#1f6feb}
button.danger{background:#8b2b2b;border-color:#8b2b2b}
.btns{display:flex;gap:8px;margin-bottom:12px}
.msg{font-size:12px;color:var(--warn);min-height:16px;margin-top:6px}
.err-box{color:var(--bad);font-size:12px;margin-top:8px;word-break:break-all}
</style>
</head>
<body>
<h1>Frida Control</h1>
<div class="sub" id="sub">读取中…</div>

<div class="card">
  <div class="row"><span class="k">状态</span><span class="v" id="state">—</span></div>
  <div class="row"><span class="k">端口</span><span class="v" id="port">—</span></div>
  <div class="row"><span class="k">进程</span><span class="v" id="pid">—</span></div>
  <div class="row"><span class="k">版本</span><span class="v" id="ver">—</span></div>
  <div class="row"><span class="k">路径</span><span class="v" id="path">—</span></div>
  <div class="row"><span class="k">模式</span><span class="v" id="mode">—</span></div>
  <div class="row"><span class="k">隐藏</span><span class="v" id="hide">—</span></div>
  <div class="err-box" id="err"></div>
</div>

<div class="btns">
  <button class="primary" onclick="act('start')">启动</button>
  <button class="danger" onclick="act('stop')">停止</button>
</div>
<div class="btns">
  <button onclick="act('set-mode-local')">local</button>
  <button onclick="act('set-mode-wifi')">wifi</button>
  <button onclick="act('log')">日志</button>
</div>
<div class="msg" id="msg"></div>

<pre id="log" style="display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:11px;overflow:auto;max-height:300px"></pre>

<script>
var DIR='/data/adb/modules/frida-control';
var busy=false;

function exec(cmd){
  return new Promise(function(res){
    if(window.ksu && typeof window.ksu.exec==='function'){
      var name='cb'+Date.now()+Math.floor(Math.random()*1000);
      window[name]=function(errno,stdout,stderr){ delete window[name]; res({errno:errno,stdout:stdout||'',stderr:stderr||''}); };
      try{ window.ksu.exec(cmd,'{}',name); }catch(e){ res({errno:-1,stdout:'',stderr:String(e)}); }
      return;
    }
    res({errno:-1,stdout:'',stderr:'当前环境不支持执行'});
  });
}

function ctl(args){
  if(!/^(start|stop|restart|status|json|probe|log)$/.test(args)) return Promise.resolve({errno:1,stdout:'',stderr:'非法参数'});
  return exec('sh '+DIR+'/ctl.sh '+args);
}

function setMode(m){
  return exec('sh '+DIR+'/ctl.sh set MODE '+m+' && sh '+DIR+'/ctl.sh restart');
}

function parseJson(s){
  try{ return JSON.parse(s.trim()); }catch(e){ return null; }
}

function render(d){
  if(!d){ document.getElementById('sub').textContent='读不到状态'; return; }
  var st=d.state||'?';
  var cls= st==='RUNNING'?'on':(st==='NO_BINARY'?'err':'off');
  document.getElementById('sub').textContent='v'+(d.version||'?')+' · 模块 '+(d.module||'frida-control');
  document.getElementById('state').innerHTML='<span class="dot '+cls+'"></span>'+st;
  document.getElementById('port').textContent=(d.addr||'?')+':'+(d.port||'?')+(d.listening?' (监听中)':' (未监听)');
  document.getElementById('pid').textContent=d.pid||'—';
  document.getElementById('ver').textContent=d.version_server||'—';
  document.getElementById('path').textContent=d.path||'—';
  document.getElementById('mode').textContent=d.mode||'—';
  document.getElementById('hide').textContent=d.hidden?'开':'关';
  document.getElementById('err').textContent=d.error?('错误：'+d.error):'';
}

function refresh(){
  return ctl('json').then(function(r){ render(parseJson(r.stdout)); });
}

function act(what){
  if(busy) return;
  busy=true;
  var msg=document.getElementById('msg');
  msg.textContent='处理中…';
  var p;
  if(what==='start') p=ctl('start');
  else if(what==='stop') p=ctl('stop');
  else if(what==='set-mode-local') p=setMode('local');
  else if(what==='set-mode-wifi') p=setMode('wifi');
  else if(what==='log'){
    p=ctl('log').then(function(r){
      var el=document.getElementById('log');
      el.style.display='block';
      el.textContent=r.stdout||'（没有日志）';
      return null;
    });
  }
  p.then(function(r){
    if(r && r.stdout){ var d=parseJson(r.stdout); if(d) render(d); }
    msg.textContent= what==='log'?'':('完成 '+(r?('(errno='+r.errno+')'):''));
    return refresh();
  }).catch(function(e){
    msg.textContent='失败：'+e;
  }).then(function(){ busy=false; });
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
