# Temporary: runs only the Android Shell suites touched by the root-channel work,
# so the Kotlin unit tests and the Dart page tests actually execute on this branch.
name: Phone shell tests

on:
  push:
    branches: [v1.0.15-root]
    paths:
      - 'app/android/**'
      - 'app/lib/phone/**'
      - 'app/lib/ui/phone/**'
      - 'app/test/phone/**'
      - '.github/workflows/zz-phone-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phone-shell-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  GRADLE_VERSION: 9.3.1
  TZ: Asia/Shanghai

jobs:
  jvm:
    name: Android JVM
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DSH_MAVEN_MIRRORS: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter plugins and local.properties
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - working-directory: app/android
        run: gradle --stacktrace :app:testArm64DebugUnitTest --tests '*phone.shell.*' --tests '*PhoneAndroidShellTest*'

  dart:
    name: Dart phone tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Phone tests
        run: flutter test --no-pub --reporter github test/phone/android_shell
