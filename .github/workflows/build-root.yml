# 构建带真 root 能力的 DSH Go Root APK（arm64）。
#
# 触发：推送到 v1.0.15-root 分支时自动跑；也可以手动 dispatch。
#
# 流程：拉上游 release 里的预编译运行时（rootfs + proot jniLibs）到 runtime/out，
# 再走官方 tooling/build-apk.sh，最后用 release_assets.py 出 update.json / SHA256SUMS。
#
# 包名 io.github.ouy09103.dsh_go_root，应用名「DSH Go Root」，可与原版共存安装。
# 没有配置 keystore secrets 时用 debug 签名，够自己装手机上试。
name: Build root APK

on:
  push:
    branches: [v1.0.15-root]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      version:
        description: 版本名（如 1.0.16-root.1）
        required: false
        default: 1.1.1-root.1
      draft:
        description: 发布为 draft release
        type: boolean
        required: false
        default: true

concurrency:
  group: build-root-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.7
  VERSION: ${{ github.event.inputs.version || '1.1.1-root.1' }}
  # 云端跑：走 google()/mavenCentral() 官方源。国内镜像在 Actions 上会 502。
  DSH_MAVEN_MIRRORS: '0'

jobs:
  arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # 别删 ndk：tawcroot 要用它编 libtawcroot.so（flutter.ndkVersion）。
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # tawcroot（可选启动方式）要用固定版本的 NDK 编 libtawcroot.so；
      # runner 镜像自带的版本未必对得上，缺了就装。
      - name: Ensure NDK
        run: |
          ndk_version=$(python3 -c "import json;print(json.load(open('runtime/tawcroot/source.json'))['ndkVersion'])")
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -f "$sdk/ndk/$ndk_version/source.properties" ]; then
            echo "installing NDK $ndk_version into $sdk"
            sdkmanager_bin=$(command -v sdkmanager || echo "$sdk/cmdline-tools/latest/bin/sdkmanager")
            yes | "$sdkmanager_bin" --sdk_root="$sdk" --install "ndk;$ndk_version" >/dev/null
          fi
          echo "ANDROID_NDK_HOME=$sdk/ndk/$ndk_version" >> "$GITHUB_ENV"
          ls "$sdk/ndk"
          df -h /

      - name: Fetch prebuilt runtime
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xz-utils
          bash tooling/fetch-runtime.sh arm64-v8a 1.0.15
          ls -la runtime/out/arm64-v8a/assets/runtime
          head -c 400 runtime/out/arm64-v8a/assets/runtime/manifest.json; echo

      - name: Pub get
        working-directory: app
        run: |
          flutter config --no-analytics
          flutter precache --android
          flutter pub get

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "no release keystore configured; the APK is debug-signed"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/android/key.properties

      - name: Build APK
        run: bash tooling/build-apk.sh -f arm64 --build-name "$VERSION"

      - name: Release assets
        run: |
          # 同一份说明既进 update.json（App 内更新能看到改了什么），也进 Release 正文。
          # 版本号用 python 替换：sed 里 $ 和 {} 是正则元字符，直替换会走样。
          python3 -c 'import pathlib,sys; t=pathlib.Path("docs/release-notes-root.md").read_text(encoding="utf-8"); pathlib.Path(sys.argv[2]).write_text(t.replace("@VERSION@", sys.argv[1]), encoding="utf-8")' "$VERSION" "$RUNNER_TEMP/notes.md"
          python3 tooling/release_assets.py --version "$VERSION" --delta-from 0 --out dist \
            --notes "$RUNNER_TEMP/notes.md"
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-root-arm64
          path: dist/
          retention-days: 30

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' || vars.PUBLISH_ROOT_RELEASE == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: DSH Go Root ${{ env.VERSION }}
          draft: ${{ github.event_name != 'workflow_dispatch' || inputs.draft }}
          prerelease: false
          files: dist/*
          body_path: ${{ runner.temp }}/notes.md
