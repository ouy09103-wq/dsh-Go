# 构建带真 root 能力的 DSH Go Root APK（arm64）。
#
# 触发：推送到 v1.0.15-root 分支时自动跑；也可以手动 dispatch。
#
# 流程：拉上游 release 里的预编译运行时（rootfs + proot jniLibs）到 runtime/out，
# 再走官方 tooling/build-apk.sh，最后用 release_assets.py 出 update.json / SHA256SUMS。
#
# 包名 io.github.ouy09103.dsh_go_root，应用名「DSH Go Root」，可与原版共存安装。
# 没有配置 keystore secrets 时用 debug 签名，够自己装手机上试。
name: Build root APK

on:
  push:
    branches: [v1.0.15-root]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      version:
        description: 版本名（如 1.0.16-root.1）
        required: false
        default: 1.1.0-root.7
      draft:
        description: 发布为 draft release
        type: boolean
        required: false
        default: true

concurrency:
  group: build-root-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.7
  VERSION: ${{ github.event.inputs.version || '1.1.0-root.7' }}
  # 云端跑：走 google()/mavenCentral() 官方源。国内镜像在 Actions 上会 502。
  DSH_MAVEN_MIRRORS: '0'

jobs:
  arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # 别删 ndk：tawcroot 要用它编 libtawcroot.so（flutter.ndkVersion）。
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # tawcroot（可选启动方式）要用固定版本的 NDK 编 libtawcroot.so；
      # runner 镜像自带的版本未必对得上，缺了就装。
      - name: Ensure NDK
        run: |
          ndk_version=$(python3 -c "import json;print(json.load(open('runtime/tawcroot/source.json'))['ndkVersion'])")
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -f "$sdk/ndk/$ndk_version/source.properties" ]; then
            echo "installing NDK $ndk_version into $sdk"
            sdkmanager_bin=$(command -v sdkmanager || echo "$sdk/cmdline-tools/latest/bin/sdkmanager")
            yes | "$sdkmanager_bin" --sdk_root="$sdk" --install "ndk;$ndk_version" >/dev/null
          fi
          echo "ANDROID_NDK_HOME=$sdk/ndk/$ndk_version" >> "$GITHUB_ENV"
          ls "$sdk/ndk"
          df -h /

      - name: Fetch prebuilt runtime
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xz-utils
          bash tooling/fetch-runtime.sh arm64-v8a 1.0.15
          ls -la runtime/out/arm64-v8a/assets/runtime
          head -c 400 runtime/out/arm64-v8a/assets/runtime/manifest.json; echo

      - name: Pub get
        working-directory: app
        run: |
          flutter config --no-analytics
          flutter precache --android
          flutter pub get

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "no release keystore configured; the APK is debug-signed"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/android/key.properties

      - name: Build APK
        run: bash tooling/build-apk.sh -f arm64 --build-name "$VERSION"

      - name: Release assets
        run: |
          python3 tooling/release_assets.py --version "$VERSION" --delta-from 0 --out dist
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-root-arm64
          path: dist/
          retention-days: 30

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' || vars.PUBLISH_ROOT_RELEASE == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: DSH Go Root ${{ env.VERSION }}
          draft: ${{ github.event_name != 'workflow_dispatch' || inputs.draft }}
          prerelease: false
          files: dist/*
          body: |
            DSH Go **Root** ${{ env.VERSION }} —— 个人 fork，含 root `shell` 工具。

            - 已同步上游 ccch1mneyyy/dsh-Go main（至 dd0a8d5），运行时 1.0.15
            - 不含内置 frida（代码、模块、打包步骤都已移除）
            - 包名 `io.github.ouy09103.dsh_go_root`，应用名「DSH Go Root」，**可与原版同时安装**
            - arm64 · Android 8.0（API 26）以上
            - 没有配置签名 secrets 时是 debug 签名

            **这一版修的三件事**

            - **root 开关胶囊回来了。** 右划快捷入口面板底部那一条又在：开着时整条是警示色，
              点一下开关，不用为开一次翻进设置。它和设置里的开关是同一个值。
            - **Android Shell 有了 root 通道。** 连接方式现在有三条：Shizuku、自连 ADB、
              **Root**。选 Root 就走 `su` 以 uid 0 执行；`su` 返回应用身份时按失败报告，
              不会假装是 root。每条命令仍然单独原生确认。
            - **「Root 权限」并进 Android Shell 页，只剩一个开关。** 设置里不再单列一页，
              原来的入口现在直接打开 Android Shell。总开关、su 能力清单、root 控制台都在页里。
            - **命令拦截档位跟 DSHA 对齐。** 严格（逐条按手机操控规则判定）／放宽（默认，
              任意命令但拦不可逆操作）／完全放宽（不看命令内容）。三个档位都会拦格式化、
              刷机、清数据这类不可逆操作。

            **另外**

            - **插件可以本地安装了。** 插件页右上角多一个按钮，直接选手机里的插件包
              （`.tgz` / `.tar.gz` / `.zip`）装上，不走市场、不联网、不经过上传。包里必须有
              `package.json`；顶层多套一层目录（GitHub 源码包那种）会自动铺平。

            ⚠️ 打开「启用 root」后，模型能以 root 身份执行任意命令。先备份，别装在主力机上。
