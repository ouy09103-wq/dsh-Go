# 只跑 root 包的 JVM 单测（手动触发）。
#
# root 通道换成 DSHA v0.2.2 的 helper 架构后，槽位 / 看门狗 / su 候选这几块是纯逻辑，
# 不需要真机和 root，适合单独跑一遍；不要挂到 main 的 CI 上当新的必过项。
name: Root unit tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root:
    name: Root JVM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DSH_MAVEN_MIRRORS: '0'
      FLUTTER_VERSION: 3.47.7
      GRADLE_VERSION: 9.3.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter plugins and local.properties
        working-directory: app
        run: |
          flutter config --no-analytics
          flutter pub get
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
      # gradlew is not tracked, so Gradle comes from here.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Root unit tests
        working-directory: app/android
        run: gradle --stacktrace :app:testArm64DebugUnitTest --tests 'io.github.ouy09103.dsh_go_root.root.*'
