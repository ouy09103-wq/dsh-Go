# Temporary: redraw the plugin goldens after the action bar gained a button.
name: Regen goldens

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  TZ: Asia/Shanghai

jobs:
  regen:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install the fonts the goldens were drawn with
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq fonts-noto-cjk=1:20230817+repack1-3 fonts-noto-cjk-extra=1:20230817+repack1-3
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/emoji.ttf" https://raw.githubusercontent.com/googlefonts/noto-emoji/v2.051/fonts/NotoColorEmoji.ttf
          echo "72a635cb3d2f3524c51620cdde406b217204e8a6a06c6a096ff8ed4b5fd6e27b  $RUNNER_TEMP/emoji.ttf" | sha256sum -c -
          sudo install -Dm644 "$RUNNER_TEMP/emoji.ttf" /usr/share/fonts/noto/NotoColorEmoji.ttf
      - run: flutter pub get --enforce-lockfile
      - name: Redraw
        env:
          DSH_TEST_FONT_DIR: /usr/share/fonts/opentype/noto
        run: |
          flutter test --update-goldens --no-pub \
            test/plugins/plugins_golden_test.dart \
            test/plugins/market_official_golden_test.dart \
            test/plugins/seats/plugin_web_places_test.dart \
            test/plugins/seats/seats_pages_test.dart
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: goldens
          path: |
            app/test/plugins/goldens
            app/test/plugins/seats/goldens
          retention-days: 7
