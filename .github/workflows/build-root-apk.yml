# 构建 root 版 dsh-go APK：真 root 引擎（su + chroot）、mcp__root__* 工具、frida-server。
#
# 和官方构建的差别只有两处：
#   1. 构建前用 tooling/fetch-runtime.sh 从上游 release 取预编译运行时（rootfs + proot jniLibs）到 runtime/out；
#   2. applicationId 是 io.github.ccch1mneyyy.dsh_root，可以和官方版装在同一台手机上。
#
# secrets 全部可选，缺了就用 debug 签名：
#   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
name: Build root APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本名（如 1.0.9-root.2）'
        required: true
        default: '1.0.9-root.2'
      publish:
        description: '构建完成后发布到 Release'
        type: boolean
        default: true
  push:
    branches:
      - root-build

concurrency:
  group: build-root-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk \
            /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          df -h /

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Fetch prebuilt runtime
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xz-utils
          bash tooling/fetch-runtime.sh arm64-v8a
          ls -la runtime/out/arm64-v8a/assets/runtime
          python3 -c "import json;print(json.load(open('runtime/out/arm64-v8a/assets/runtime/manifest.json'))['runtimeVersion'])"

      - name: Pub get
        working-directory: app
        run: |
          flutter config --no-analytics
          flutter precache --android
          flutter pub get

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "no keystore secret: this build is debug-signed"
            exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/android/key.properties

      - name: Build APK
        run: |
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then version="1.0.9-root.2"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          bash tooling/build-apk.sh -f arm64 --build-name "$version" -- --dart-define=DSH_ROOT_BUILD=1

      - name: Name the artifact
        run: |
          src=$(ls app/build/app/outputs/flutter-apk/app-arm64-release.apk | head -1)
          out="dsh-go-root-${VERSION}-arm64.apk"
          cp "$src" "$out"
          sha256sum "$out" | tee "$out.sha256"
          echo "APK=$out" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-root-arm64
          path: |
            dsh-go-root-*.apk
            dsh-go-root-*.apk.sha256
          retention-days: 60

      # A push to root-build publishes too: the build is the deliverable, and leaving it only in
      # the Actions artifact tab means the Release keeps the previous APK. Dispatch can opt out.
      - name: Attach to a release
        if: github.event_name == 'push' || inputs.publish == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: root-${{ env.VERSION }}
          name: dsh-go root ${{ env.VERSION }}
          body: |
            真 root 版：su + chroot 跑引擎（uid 0）、`mcp__root__*` 工具、frida-server 管理。
            applicationId 是 `io.github.ccch1mneyyy.dsh_root`，可与官方版共存。
          files: |
            dsh-go-root-*.apk
            dsh-go-root-*.apk.sha256
