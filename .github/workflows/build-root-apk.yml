# 构建 root 版 dsh-go APK：真 root 引擎（su + chroot）、mcp__root__* 工具、frida-server。
#
# 与官方 tooling/build-apk.sh 的差别只有两处：
#   1. 构建前用 tooling/fetch-runtime.sh 把预编译运行时（rootfs + proot jniLibs）从
#      上游 release 取到 runtime/out；
#   2. applicationId 用 io.github.ccch1mneyyy.dsh_root，可以和官方版装在同一台手机上。
#
# secrets（都可选，缺了就 debug 签名，装之前先卸掉旧 debug 包）：
#   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
name: Build root APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本名（如 1.0.9-root.1）
        required: false
        default: 1.0.9-root.1
      abi:
        description: arm64 或 x64
        required: false
        default: arm64
  push:
    branches: [root-build]
    paths:
      - 'app/**'
      - 'runtime/**'
      - 'tooling/**'
      - '.github/workflows/build-root-apk.yml'

concurrency:
  group: build-root-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      ABI: ${{ github.event.inputs.abi || 'arm64' }}
      VERSION: ${{ github.event.inputs.version || '1.0.9-root.1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Fetch prebuilt runtime
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xz-utils
          abi_dir=$([[ "$ABI" == "x64" ]] && echo x86_64 || echo arm64-v8a)
          bash tooling/fetch-runtime.sh "$abi_dir"
          ls -la "runtime/out/$abi_dir/assets/runtime"
          python3 -c "import json;print(json.load(open('runtime/out/$abi_dir/assets/runtime/manifest.json'))['runtimeVersion'])"

      - name: Pub get
        working-directory: app
        run: |
          flutter config --no-analytics
          flutter precache --android
          flutter pub get

      - name: Signing key
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > app/android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Analyse (Dart)
        working-directory: app
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib/root lib/ui/settings/root_page.dart lib/runtime || true

      - name: Build APK
        run: |
          bash tooling/build-apk.sh -f "$ABI" --build-name "$VERSION" -- --dart-define=DSH_ROOT_BUILD=1

      - name: Name the artifact
        run: |
          src=$(ls app/build/app/outputs/flutter-apk/app-*-release.apk | head -1)
          out="dsh-go-root-$VERSION-$ABI.apk"
          cp "$src" "$out"
          sha256sum "$out" | tee "$out.sha256"
          echo "APK=$out" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-root-${{ env.ABI }}
          path: |
            dsh-go-root-*.apk
            dsh-go-root-*.apk.sha256
          retention-days: 60

      - name: Attach to a release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: root-${{ env.VERSION }}
          name: dsh-go root ${{ env.VERSION }}
          body: |
            真 root 版：su + chroot 跑引擎（uid 0）、`mcp__root__*` 工具、frida-server 管理。
            applicationId 是 `io.github.ccch1mneyyy.dsh_root`，可与官方版共存。
          files: |
            dsh-go-root-*.apk
            dsh-go-root-*.apk.sha256
